# llm_context_os/config/config.yaml

# --- Configuration for API server components ---

context_manager:
  system_prompt: "You are a super helpful AI assistant configured via YAML."
  max_tokens: 3500 # Example override of default

chat_history_retriever:
  recall_budget_tokens: 600
  # Default embedding model, e.g., 'BAAI/bge-base-en-v1.5' or 'sentence-transformers/all-MiniLM-L6-v2'
  embedding_model_name: "BAAI/bge-base-en-v1.5"
  vector_db_path: "data/vector_dbs/yaml_configured_chat_history" # Unique path
  # Model for re-ranking initial candidates, e.g., 'cross-encoder/ms-marco-MiniLM-L-6-v2'
  cross_encoder_model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  # Number of initial candidates to fetch from vector DB for re-ranking
  rerank_top_n_candidates: 25
  enable_hybrid_search: true  # Enable or disable hybrid (BM25 + dense) search
  rrf_k_constant: 60          # RRF K constant for fusion scoring

pdf_retriever:
  vector_db_path: "data/vector_dbs/yaml_configured_pdf_rag"
  # Default embedding model, e.g., 'BAAI/bge-base-en-v1.5' or 'sentence-transformers/all-MiniLM-L12-v2'
  embedding_model_name: "BAAI/bge-base-en-v1.5"
  chunk_size: 750
  chunk_overlap: 75
  recall_budget_tokens: 1536 # Example for PDF retriever
  # Model for re-ranking initial candidates, e.g., 'cross-encoder/ms-marco-MiniLM-L-6-v2'
  cross_encoder_model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  # Number of initial candidates to fetch from vector DB for re-ranking
  rerank_top_n_candidates: 25
  enable_hybrid_search: true  # Enable or disable hybrid (BM25 + dense) search
  rrf_k_constant: 60          # RRF K constant for fusion scoring

model_manager:
  default_idle_unload_sec: 1200 # e.g., 20 minutes

# Configuration for the tokenizer used by RAG components for budgeting snippets
token_estimator_for_rag_budgeting:
  type: "tiktoken" # Options: "tiktoken", "hf" (Hugging Face)
  # model_name for tiktoken: e.g., "cl100k_base", "p50k_base"
  # model_name for hf: e.g., "gpt2", "facebook/opt-125m"
  model_name: "cl100k_base"

# --- Model Discovery Configuration ---
# Define a list of directories to scan for local models.
# Paths can be absolute or relative to the project root (where llm_context_os is located).
# For dockerized environments, these paths should correspond to paths within the container.
# For downloaded models to be automatically discovered, ensure the 'model_download_dir' (see below)
# or specific subdirectories within it are included in this list.
model_scan_directories:
  - "models/" # Default local models directory, relative to project root
  # - "/path/to/another/model_collection" # Absolute path example
  # - "models/ggufs"
  # - "models/awq_models"

# --- Model Downloading Settings ---
# Specifies the base directory where models downloaded from Hugging Face will be saved.
# A subdirectory named after the model repository (e.g., 'TheBloke_Mistral-7B-Instruct-v0.1-GGUF')
# will be created inside this directory for each download.
# For downloaded models to be discoverable by the `/models/available` endpoint, this path
# (or one of its parent directories, if this is a subdirectory like 'models/downloaded/')
# must be included in the 'model_scan_directories' list above.
model_download_dir: "models/downloaded/"

# Optional: Your Hugging Face API token (string).
# Required for downloading private or gated models from Hugging Face Hub.
# If set to null or not provided, only public models can be downloaded.
# This can also be set via the HUGGING_FACE_HUB_TOKEN environment variable,
# which takes precedence if both are set.
hf_token: null

# For repository snapshot downloads (when no specific filename is provided in the download request):
# Optional: List of glob patterns to ignore when downloading an entire repository snapshot.
# Useful for excluding unnecessary files like documentation, examples, or non-model files.
# Examples: ["*.md", "LICENSE", ".gitattributes", "*.txt", "*.pyc", "docs/*", "*.git*"]
hf_snapshot_ignore_patterns:
  - "*.md"
  - "LICENSE"
  - ".gitattributes"
  # - "*.pt" # Example: if you only want .safetensors or .gguf
  # - "*.bin" # Example: if you only want .safetensors or .gguf

# Optional: List of glob patterns to exclusively include when downloading a repository snapshot.
# If specified, only files matching these patterns will be downloaded. This takes precedence over hf_snapshot_ignore_patterns.
# Useful for targeting specific file types (e.g., only GGUF files, or only safetensors and tokenizer files).
# Example for GGUF: ["*.gguf", "*.json"] (to get model and any metadata like generation_config.json)
# Example for safetensors: ["*.safetensors", "*.json", "tokenizer.model", "tokenizer_config.json"]
hf_snapshot_allow_patterns: null

# Optional: Type of the Hugging Face repository (e.g., "model", "dataset", "space").
# This is passed to huggingface_hub functions. If set to null or omitted,
# huggingface_hub will usually auto-detect the repository type.
# It's generally recommended to leave this as null unless specific behavior is required.
hf_repo_type: null
