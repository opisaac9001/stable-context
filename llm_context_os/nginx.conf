# yawl/nginx.conf

server {
    listen 80;
    server_name localhost; # Or your domain

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Serve static files directly
    location / {
        # Try to serve file directly, then directory, then fall back to index.html for SPA routing
        try_files $uri $uri/ /index.html;
    }

    # Optional: You can add specific caching policies for assets here
    # location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
    #     expires 1y;
    #     add_header Cache-Control "public";
    # }

    # Optional: Gzip compression for text-based assets
    # gzip on;
    # gzip_vary on;
    # gzip_proxied any;
    # gzip_comp_level 6;
    # gzip_buffers 16 8k;
    # gzip_http_version 1.1;
    # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Optional: Deny access to hidden files (e.g., .htaccess, .git)
    location ~ /\. {
        deny all;
    }
}
